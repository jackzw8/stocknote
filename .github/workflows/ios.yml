# iOS 打包（GitHub Actions，**手动触发**）—— 老周 2026-09-30
#
# 为什么用 Actions：本机是 Windows，而 Kotlin/Native 只能在 macOS 上链接 Apple 产物，
# 所以 iOS 版本必须借 GitHub 的 macOS runner 出包。
#
# ⚠️ **签名**：仓库里没有（也不该有）Apple 开发者证书，所以这里产出的是
# **未签名 IPA**，需要用 AltStore / Sideloadly / 爱思助手等工具自签后装到 iPhone/iPad。
#
# ⚠️ 首次运行大概率需要迭代：iOS 侧代码此前**从未在 macOS 上编译过**
#（见 StockNoteKMP/iosApp/README.md 的「未验证」说明）。
name: iOS 打包（手动）

on:
  # 只手动触发：不在 push / PR 上自动跑（macOS runner 很贵，私有仓库按 10 倍分钟计费）
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      build_simulator:
        description: 只编译模拟器版本（快、不出 IPA，用于验证代码能否编译）
        required: false
        default: false
        type: boolean

jobs:
  build-ios:
    name: 构建 iOS 应用
    # ⚠️ 2026-10-01 演进史（每一步都是被 CI 逼出来的）：
    #   ① macos-14：默认 Xcode **15.4**，打不开 XcodeGen 2.46 生成的 Xcode 16 工程格式
    #      （objectVersion 77）→ `Unable to read project ... future Xcode project file format (77)`。
    #   ② macos-15：Xcode **16.4**，工程能打开了，但只带 **iOS 18.5 SDK** ——
    #      Compose Multiplatform 1.11 编出的 SharedUI 引用了 **iOS 26 才有的 `UIViewLayoutRegion`**
    #      （位于 SwiftUICore），归档链接时报：
    #        Undefined symbols: _OBJC_CLASS_$_UIViewLayoutRegion, referenced from SharedUI(CMPLayoutRegion.o)
    #        ld: symbol(s) not found for architecture arm64 / ** ARCHIVE FAILED **
    #   ③ macos-26（2026-02 起 GA）：自带 **Xcode 26 / iOS 26 SDK**，`UIViewLayoutRegion` 才存在。
    #   ④ ⭐ 2026-10-02：改成 **`macos-26-intel`** —— 同为 Xcode 26 / iOS 26 SDK，但内存翻倍。
    #      为什么必须换：`macos-26` 是 **arm64** 标准档，只有 **3 vCPU / 7 GB**；
    #      而 14 GB 那档是 Intel 标准档（4 vCPU / 14 GB）。两者都是**免费标准 runner**
    #      （macOS 标准档对公开/私有仓库规格一致，公开仓库不限量）。
    #      上一轮 `:shared:feature:linkReleaseFrameworkIosArm64` 在 6144m 堆上 OOM，
    #      栈顶是 `konan.optimizations.DevirtualizationAnalysis ... mergeEdges`：
    #      这类 OOM 是**堆上限**被顶到（不是被系统杀），所以光加内存不够、光提上限也不行 —— 两件事一起改：
    #        · `kotlin.daemon.jvmargs` 6144m → 10240m（见 StockNoteKMP/gradle.properties）
    #        · runner 换成 14 GB 的 `macos-26-intel`
    #      产出物仍是 `iosArm64` 的 framework（K/N 在 Intel 宿主上交叉编译 Apple 设备产物是常规路径）。
    runs-on: macos-26-intel
    # ⚠️ 2026-10-01：曾一度提到 180，现改回 90。
    #   原因：真实故障不是"跑太久超时"，而是 **xcodebuild 的 script phase 挂死**
    #   （Xcode 里跑 ./gradlew 时 Gradle daemon 起不来，见 iosApp/project.yml 的 --no-daemon 修复）。
    #   挂死时超时越长、用户白等越久（180 分钟意味着要干等 3 小时），90 分钟是"正常能跑完"与
    #   "卡死时别耗太久"之间的平衡：正常流程约 30~40 分钟（link 单次 19m41s + Xcode 编译）。
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Kotlin/Native 工具链约 1~2GB，且首次链接很慢 —— 必须缓存，否则每次都要重下
      - name: 缓存 Gradle 与 Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-konan-${{ hashFiles('StockNoteKMP/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-konan-

      # 打印 Xcode 版本：工程格式（objectVersion）与 Xcode 大版本强相关，
      # 以后再出 "future Xcode project file format" 这类错，一眼就能对上。
      - name: 显示 Xcode 版本
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          xcodebuild -version
          xcode-select -p

      # ⭐ 2026-10-02 加：**打印 runner 的真实硬件规格**。
      # 起因：`macos-26`（arm64）标准档只有 7 GB 内存，而 14 GB 那档是 `macos-26-intel` ——
      # 这个差异直接决定 Kotlin/Native 能不能链上 release framework，但**日志默认一个数字都不写**，
      # 害得我们按「runner 有 14G」的错误印象把堆上限一路往上调（见 gradle.properties 的注释）。
      # 以后调 jvmargs / 换 runner 之前，先看这几行。
      - name: 打印 runner 硬件信息
        run: |
          uname -srm
          sysctl -n hw.ncpu
          sysctl -n hw.memsize | awk '{printf "RAM: %.1f GB\n", $1/1024/1024/1024}'
          df -h / | tail -1
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 编译共享层（Kotlin → SharedUI.framework）
        working-directory: StockNoteKMP
        run: |
          chmod +x gradlew
          # ⭐ 2026-10-03：链接目标**跟随手动触发时选的 configuration** ——
          #   Release（默认，出正式包）：linkReleaseFrameworkIosArm64，实测约 14 分钟；
          #   Debug（只想快跑一轮验证"代码能不能编译/能不能起来"）：linkDebugFrameworkIosArm64，
          #   通常几分钟。此前这里写死 Release，于是即使选了 Debug 也照样干等 14 分钟。
          #   （Xcode 侧的 script phase 本来就会按 CONFIGURATION 自动选 Debug/Release，无需改。）
          if [ "${{ inputs.configuration }}" = "Debug" ]; then
            ./gradlew :shared:feature:linkDebugFrameworkIosArm64 --no-daemon --stacktrace
          else
            ./gradlew :shared:feature:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace
          fi

      # ⚠️ 诊断用（2026-10-01，保留：只花 1 秒，且回答"最低可用 iOS 是多少"这个真问题）：
      # Compose Multiplatform 1.10+ 的 iOS 实现（CMPLayoutRegion）引用了 iOS 26 才有的
      # `UIViewLayoutRegion`（在 SwiftUICore 里）。这里看该符号的**链接属性**：
      #   weak external  → 旧系统上符号缺失时指针为 nil，只要 CMP 内部有 @available 判断就不会崩；
      #   external       → 旧系统 dyld 会因找不到符号而**启动即崩**（等于只能 iOS 26+ 用）。
      - name: 检查 UIViewLayoutRegion 的链接属性（判断最低可用 iOS）
        working-directory: StockNoteKMP
        run: |
          FW=$(find shared/feature/build -type f -name 'SharedUI' -path '*Framework*' | head -1)
          echo "framework binary: $FW"
          if [ -n "$FW" ]; then
            nm -m "$FW" 2>/dev/null | grep -iE 'UIViewLayoutRegion|SwiftUICore' || echo '(未找到该符号)'
          fi

      - name: 生成 Xcode 工程
        working-directory: StockNoteKMP/iosApp
        run: xcodegen generate

      # ⚠️⚠️ 2026-10-01：**归档前必须校验 Info.plist 真的会被用上**。
      # 此前 project.yml 用的是 `info:` 段 —— 那语义是「让 XcodeGen **生成**一份 Info.plist」，
      # 不是「使用仓库里这份」，结果仓库里那份被架空：
      # 线上 IPA 里 21 个键全是 Xcode 注入的，自定义的 4 项（含 CMP 启动强校验必需的
      # CADisableMinimumFrameDurationOnPhone）**一个都不在**，版本也退回 1.0/1。
      # 于是「补了修复却依然闪退」白跑两轮 CI —— 这一步就是防止同类问题再次无声发生。
      - name: 校验 Info.plist 会被真正用上
        working-directory: StockNoteKMP
        run: |
          echo "===== ① 仓库里的 Info.plist 关键键（文件本身没问题吧？）====="
          # ⚠️ 2026-10-03：不再校验图标键（CFBundleIconName）—— 图标已在真机确认显示正常（老周）。
          for k in CADisableMinimumFrameDurationOnPhone CFBundleShortVersionString CFBundleVersion CFBundleDisplayName UILaunchScreen; do
            printf '%-45s = ' "$k"
            /usr/libexec/PlistBuddy -c "Print :$k" iosApp/iosApp/Info.plist 2>/dev/null || echo "!!! 缺失 !!!"
          done
          echo "===== ② 生成工程里的 INFOPLIST_FILE（应指向 iosApp/Info.plist）====="
          grep -E "INFOPLIST_FILE|GENERATE_INFOPLIST_FILE" iosApp/StockNoteApp.xcodeproj/project.pbxproj | sort -u || echo "(未找到，需人工检查)"

      # ---- 仅模拟器：快速验证能否编译（不出 IPA）----
      - name: 构建（模拟器，仅验证编译）
        if: ${{ inputs.build_simulator }}
        working-directory: StockNoteKMP/iosApp
        run: |
          xcodebuild \
            -project StockNoteApp.xcodeproj \
            -scheme StockNoteApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      # ⭐ 2026-10-03 加：把 SwiftPM 的克隆目录缓存起来。
      # 里面是 SQLCipher 的预编译 xcframework（几十 MB），**每次运行都要重新 clone/下载**，
      # 而内容只随版本变化（版本在 project.yml 里写死 4.17.0）—— 属于纯浪费。
      - name: 缓存 SwiftPM 依赖（SQLCipher）
        if: ${{ !inputs.build_simulator }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.spm-packages
          key: spm-${{ runner.os }}-sqlcipher-4.17.0
          restore-keys: |
            spm-${{ runner.os }}-

      # ⚠️⚠️ 2026-10-02 新增：**预解析 SwiftPM 依赖（SQLCipher）**。
      # 起因：第 3 轮 CI 终于走到 xcodebuild（前面的 K/N 编译与链接都过了），却倒在
      # `Resolve Package Graph`：
      #   Fetching from https://github.com/sqlcipher/SQLCipher.swift     ← 卡了 30 秒
      #   Git command 'git -C ~/Library/Caches/org.swift.swiftpm/repositories/SQLCipher.swift-5392e827
      #     config --get remote.origin.url' failed:
      #     fatal: cannot change to '...': No such file or directory
      # ⇒ SwiftPM 的 fetch **根本没落到默认缓存目录**（不是"版本找不到"，也不是 checksum 问题）。
      # 这里三件事一起做：
      #   ① 先探 runner 能不能**直接 clone** 这个公开仓库 —— 把"网络/凭据问题"与"SwiftPM 缓存问题"分开；
      #   ② 把 SwiftPM 的**克隆目录改到工作区内**（`-clonedSourcePackagesDirPath`）：托管 runner 上
      #      默认的 `~/Library/Caches/org.swift.swiftpm` 是已知容易出问题的位置，放工作区还便于缓存；
      #   ③ 失败清掉半截缓存后**重试 3 次**（fetch 卡 30 秒也像瞬时网络问题）。
      # ⚠️ archive 那一步必须传**同一个** `-clonedSourcePackagesDirPath`，否则它会再解析一遍。
      - name: 预解析 SwiftPM 依赖（SQLCipher）
        if: ${{ !inputs.build_simulator }}
        working-directory: StockNoteKMP/iosApp
        run: |
          set -u
          echo "===== ① runner 能否直接 clone 该公开仓库 ====="
          git --version
          rm -rf /tmp/sqlcipher-probe
          if git clone --depth 1 https://github.com/sqlcipher/SQLCipher.swift /tmp/sqlcipher-probe; then
            echo "OK：git clone 成功（说明网络没问题，问题在 SwiftPM 那侧）"
            rm -rf /tmp/sqlcipher-probe
          else
            echo "!!! git clone 失败 —— 属于网络/凭据问题，不是 SwiftPM 的锅 !!!"
          fi

          echo "===== ② xcodebuild 解析依赖（克隆到工作区内，最多 3 次）====="
          SPM_DIR="$GITHUB_WORKSPACE/.spm-packages"
          for i in 1 2 3; do
            echo "----- 第 $i 次 -----"
            if xcodebuild -project StockNoteApp.xcodeproj -scheme StockNoteApp \
                 -clonedSourcePackagesDirPath "$SPM_DIR" \
                 -resolvePackageDependencies; then
              echo "OK：SwiftPM 依赖解析成功"
              exit 0
            fi
            echo "第 $i 次失败：先打印现场，再清掉半截缓存重试"
            echo "HOME=$HOME"; echo "PATH=$PATH"; which -a git || true
            ls -la "$SPM_DIR" 2>&1 | head -20 || true
            ls -la ~/Library/Caches/org.swift.swiftpm/repositories 2>&1 | head -20 || true
            rm -rf "$SPM_DIR"
            rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/SQLCipher.swift-* || true
            sleep 10
          done
          echo "!!! SwiftPM 依赖解析失败 !!!"
          exit 1

      # ---- 真机：未签名 archive ----
      - name: 构建（真机未签名 archive）
        if: ${{ !inputs.build_simulator }}
        working-directory: StockNoteKMP/iosApp
        run: |
          xcodebuild \
            -project StockNoteApp.xcodeproj \
            -scheme StockNoteApp \
            -configuration ${{ inputs.configuration }} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StockNoteApp.xcarchive" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.spm-packages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

      # ⚠️ 产物自检（P0-1，2026-10-02 起；**2026-10-03 按老周要求大幅精简**）：
      # **只留一条真正的红线** —— SQLCipher 有没有真的链上。
      # 为什么不能省：接入 SQLCipher 后若少了 `-lsqlite3` 而 SQLCipher 又没链上，`PRAGMA key` 会
      #   **静默变成空操作**、库仍是明文，而归档照样成功（"以为加密了"是最危险的失败方式）。
      # 为什么这么短：这两条断言只花几秒；而**图标**（P1-5，真机已确认显示正常）、`cipher_version`
      #   标记串、`nm` 符号清单、版本号回显、bundle 目录列表这些"查产物"的项**老周 2026-10-03 要求删掉**
      #   —— 它们既不影响成败判断，也占不了多少时间（全部合计约 9 秒，真正的耗时在 K/N 链接与 Xcode 归档）。
      - name: 产物自检（SQLCipher 必须链上并嵌入）（P0-1）
        if: ${{ !inputs.build_simulator }}
        run: |
          set -eu
          APP="$RUNNER_TEMP/StockNoteApp.xcarchive/Products/Applications/StockNoteApp.app"
          FW="$APP/Frameworks/SQLCipher.framework/SQLCipher"
          if otool -L "$APP/StockNoteApp" | grep -q 'libsqlite3'; then
            echo "!!! 仍依赖系统 libsqlite3 —— PRAGMA key 会静默失效、库仍是明文 !!!"
            exit 1
          fi
          if ! otool -L "$APP/StockNoteApp" | grep -q 'SQLCipher.framework'; then
            echo "!!! 主二进制没有链接 SQLCipher.framework !!!"
            exit 1
          fi
          if [ ! -f "$FW" ]; then
            echo "!!! bundle 里没有 Frameworks/SQLCipher.framework/SQLCipher（真机启动会 dyld 闪退）!!!"
            exit 1
          fi
          if ! strings -a "$FW" | grep -qi 'cipher_version'; then
            echo "!!! SQLCipher.framework 里没有 cipher_version 标记（不像真的 SQLCipher）!!!"
            exit 1
          fi
          echo "OK：SQLCipher 已链上并嵌入（$(du -h "$FW" | cut -f1)）"

      - name: 打成未签名 IPA
        if: ${{ !inputs.build_simulator }}
        run: |
          set -e
          APP="$RUNNER_TEMP/StockNoteApp.xcarchive/Products/Applications/StockNoteApp.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "StockNoteApp-unsigned.ipa" Payload
          ls -lh "StockNoteApp-unsigned.ipa"

      - name: 上传 IPA
        if: ${{ !inputs.build_simulator }}
        uses: actions/upload-artifact@v4
        with:
          name: StockNote-iOS-unsigned-ipa
          path: ${{ runner.temp }}/StockNoteApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
