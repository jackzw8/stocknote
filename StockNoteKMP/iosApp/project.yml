# XcodeGen 配置 —— 在 macOS 上生成 Xcode 工程
#
# ⚠️ 本文件**未经验证**：构建机是 Windows，无法为 Apple 平台编译 Kotlin/Native。
# 首次在 macOS 上执行前，请先读同目录 README.md 的「首次在 macOS 上开工」一节。
#
# 用法：
#   brew install xcodegen
#   cd iosApp && xcodegen generate

name: StockNoteApp

options:
  bundleIdPrefix: com.stocknote
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # 共享 framework 由 Gradle 产出，路径遵循 KMP 官方约定
    FRAMEWORK_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/../shared/feature/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-framework"
      - "SharedUI"
      # ⚠️⚠️ 2026-10-02（P0-1）：**这里原本是 `-lsqlite3`，现在必须去掉。**
      #
      # 背景：SQLDelight 的 native driver（co.touchlab:sqliter）要调 `sqlite3_*`，
      # 而 Kotlin/Native 不会把它打进 framework，所以此前在**应用侧**补了 `-lsqlite3`
      #（不补的报错见 git 历史：`"_sqlite3_step", referenced from: … SharedUI.framework.o`）。
      #
      # 但接入 SQLCipher 后，这些 `sqlite3_*` 符号**必须由 SQLCipher 提供**：
      # 若系统 libsqlite3 与 SQLCipher 同时在场，谁提供符号取决于逐符号的链接顺序 ——
      # 一旦系统库胜出，`PRAGMA key` 会**静默变成空操作**，库仍是明文（最危险的失败方式）。
      # ⇒ 只留 SQLCipher 一个提供者；万一它没提供，链接会**直接失败**（CI 立刻红），
      #   而不是悄悄写成明文。自检见 `Platform.ios.kt` 的 `reportCipherVersion`。
      - "-framework"
      - "Security"

# SQLCipher（P0-1，2026-10-02）—— 官方 SwiftPM 包，`binaryTarget` 指向 Zetetic 在
# GitHub Releases 上发布的**预编译 xcframework**（含 sqlite3 的加密实现），
# 所以「直接集成」也能拿到 native 库，无需 CocoaPods。
#
# ⚠️ 为什么用 `exactVersion` 而不是 `from`：与 Android 侧的 `net.zetetic:sqlcipher-android`
#   保持**同一个 4.17.0**（`gradle/libs.versions.toml` 里注明了「不要升到 4.18+」，
#   因为那会要求 compileSdk 37）。两平台同版本，排查时不用先怀疑版本差异。
# ⚠️ xcframework 是从网络下载的二进制（SwiftPM 会校验 Package.swift 里写死的 sha256），
#   首次构建变慢属正常；缓存由 Xcode 的 DerivedData / GitHub Actions 的 cache 兜。
packages:
  SQLCipher:
    url: https://github.com/sqlcipher/SQLCipher.swift
    exactVersion: 4.17.0

targets:
  StockNoteApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        # ⚠️ 别把 Info.plist 当**资源**打进 bundle（会与 INFOPLIST_FILE 打架）
        excludes:
          - "Info.plist"
    # P0-1（2026-10-02）：SQLCipher 由上面的 SwiftPM 包提供 —— sqliter 的 `sqlite3_*` 符号
    # 必须解析到它（理由见上方 OTHER_LDFLAGS 处的长注释），所以**必须**挂成 target 依赖。
    dependencies:
      - package: SQLCipher
    # ⚠️⚠️ 2026-10-01：**这里原本是 `info: { path: iosApp/Info.plist }`，那是真机闪退修复"失效"的根因。**
    #
    # XcodeGen 的 `info:` 段语义是「**让 XcodeGen 生成一份 Info.plist**」（不是"使用仓库里这份"）——
    # 它自己写了一份到该路径，把仓库里那份带自定义键的文件**架空**了。
    # 实证（解析线上 IPA 里的 Info.plist）：21 个键**全是 Xcode 注入的**
    # （DTCompiler / DTSDKName / DTXcode …），而仓库里那四项**一个都不在**：
    #   CFBundleDisplayName（股票交易笔记）、UILaunchScreen、
    #   **CADisableMinimumFrameDurationOnPhone（CMP 1.7+ 启动强校验，缺它必崩）**、UIFileSharingEnabled；
    # 版本号也退回默认的 **1.0 / 1**。
    # ⇒ 于是"改了 Info.plist 却没生效"，白跑两轮 CI、真机反复闪退。
    #
    # 正确做法：**删掉 `info:` 段**，改用构建设置 `INFOPLIST_FILE` 直接指向仓库里的文件
    # （路径基准 = SRCROOT = 生成的 .xcodeproj 所在目录 = StockNoteKMP/iosApp）。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stocknote.app
        PRODUCT_NAME: StockNoteApp
        # ✅ 用仓库里的 Info.plist（不要走 XcodeGen 的 info 生成逻辑）
        INFOPLIST_FILE: iosApp/Info.plist
        # ⚠️ 必须为 NO：否则 Xcode 会生成一份默认的，同样会把 INFOPLIST_FILE 架空
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
        # ⚠️ 必须显式声明设备族：XcodeGen 默认按平台只给 iPhone（1），
        # 少了 iPad（2）装到 iPad 上会以"手机 App 兼容模式"运行、不分屏也不适配。
        # 老周 2026-09-30 明确要求「iPhone 和 iPad 都要能跑」。
        TARGETED_DEVICE_FAMILY: "1,2"
        # P1-5（2026-10-02）：App 图标。资源在 `iosApp/Assets.xcassets`（就落在下面的 sources
        # 路径里，XcodeGen 会自动把它放进 Resources 阶段），这里只需声明用哪个图集。
        # 没这一项时装出来是**默认白图标** —— 项目一直以来的状态。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      # 关键一步：让 Gradle 编译并嵌入 Kotlin framework（含 Compose UI）
      #
      # ⚠️ 2026-10-01：**必须加 `--no-daemon`**（CI 实测踩坑）。
      #   在 Xcode 的 script phase 里（非交互 shell，且处于 Xcode 的构建进程沙箱中），
      #   让 Gradle 去**启动常驻 daemon** 会**挂死**：表现为 xcodebuild 长时间毫无进展，
      #   日志里只看得到 `/bin/sh -c .../Script-xxxx.sh` 一行（Xcode 缓冲了脚本输出，
      #   所以正常运行时也看不到任何内容），job 最终只能被取消。
      #   `--no-daemon` 让 Gradle 在脚本进程内直接构建 —— 多花一两分钟启动 JVM，
      #   但不会挂。
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew --no-daemon :shared:feature:embedAndSignAppleFrameworkForXcode
