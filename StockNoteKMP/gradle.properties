# StockNoteKMP 构建参数
# 该机器 bash 的 coreutils 不可用，构建请走 PowerShell + gradle.bat（见 README.md）

# ⚠️ 2026-10-01：首次 iOS 打包在 GitHub macOS runner（14G 内存）上仍以
#   `OutOfMemoryError: Java heap space`（`konan.optimizations.DevirtualizationAnalysis`）失败 ——
#   是**配置给的堆太小**，不是机器不够。Xmx 是**上限**而非预分配：本机只做 Android 构建时
#   并不会真占到这么多，故放大安全。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
# 守护进程空闲 1 分钟自动退出（默认 3 小时，本机内存紧张改为 60s），做完构建不长期驻留
org.gradle.daemon.idletimeout=60000

kotlin.code.style=official
# ⚠️ Kotlin/Native 的编译器跑在 **Kotlin daemon** 里，而**链接 release framework 极吃内存**
#   （Compose 项目尤其明显：DevirtualizationAnalysis 要建全量虚调用图）。
#   演进：2048m → 6144m（2026-10-01，当时 OOM 在 `konan.optimizations.DevirtualizationAnalysis`）
#       → **10240m（2026-10-02）**。
#   2026-10-02 这轮 6144m **又** OOM，栈顶一模一样：
#     e: Compilation failed: Java heap space
#     java.lang.OutOfMemoryError: Java heap space
#       at ...konan.optimizations.DevirtualizationAnalysis$...$CondensationBuilder.mergeEdges
#   ⇒ 说明「6G 够用」从来就是**刚好卡在边界上**，程序图再涨一点就翻。
# ⚠️ Xmx 是**上限**而非预分配：本地只做 Android 构建时不会真占到这么多，调大是安全的。
# ⚠️ 但**上限必须配得上 runner 的物理内存** —— GitHub 的 macOS **arm64 标准 runner 只有 7 GB**
#   （`macos-26` = 3 vCPU / 7 GB；14 GB 那档是 `macos-26-intel` = 4 vCPU / 14 GB，同样免费标准档）。
#   所以 iOS CI 已同时改用 `macos-26-intel`，见 `.github/workflows/ios.yml` 的 `runs-on`。
kotlin.daemon.jvmargs=-Xmx10240m

android.useAndroidX=true
android.nonTransitiveRClass=true

# iOS 目标开关
#   auto（默认）：宿主是 macOS 时启用 iOS 目标，Windows/Linux 上自动关闭
#   true / false：强制覆盖
# 之所以要这个开关：Windows 上无法为 Apple 平台编译 Kotlin/Native，
# 但 Android 交付不能被 iOS 拖累，因此默认按宿主自动判定。
stocknote.ios=auto
