# StockNoteKMP 构建参数
# 该机器 bash 的 coreutils 不可用，构建请走 PowerShell + gradle.bat（见 README.md）

# ⚠️ 2026-10-01：首次 iOS 打包在 GitHub macOS runner（14G 内存）上仍以
#   `OutOfMemoryError: Java heap space`（`konan.optimizations.DevirtualizationAnalysis`）失败 ——
#   是**配置给的堆太小**，不是机器不够。Xmx 是**上限**而非预分配：本机只做 Android 构建时
#   并不会真占到这么多，故放大安全。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
# 守护进程空闲 1 分钟自动退出（默认 3 小时，本机内存紧张改为 60s），做完构建不长期驻留
org.gradle.daemon.idletimeout=60000

kotlin.code.style=official
# ⚠️ Kotlin/Native 的编译器跑在 **Kotlin daemon** 里，而**链接 release framework 极吃内存**
#   （Compose 项目尤其明显：DevirtualizationAnalysis 要建全量虚调用图）。
#   原值 2048m 在 CI 上直接 `e: Compilation failed: Java heap space` → 提到 6144m。
kotlin.daemon.jvmargs=-Xmx6144m

android.useAndroidX=true
android.nonTransitiveRClass=true

# iOS 目标开关
#   auto（默认）：宿主是 macOS 时启用 iOS 目标，Windows/Linux 上自动关闭
#   true / false：强制覆盖
# 之所以要这个开关：Windows 上无法为 Apple 平台编译 Kotlin/Native，
# 但 Android 交付不能被 iOS 拖累，因此默认按宿主自动判定。
stocknote.ios=auto
